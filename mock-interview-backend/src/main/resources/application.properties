
spring.config.import=optional:file:.env[.properties]

spring.application.name=mock-interview-backend
server.port=${PORT:8080}

# Database

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mock_interview}
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:admin}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# JWT
jwt.secret=${JWT_SECRET:your-very-long-secret-key-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Super Admin
superadmin.email=${SUPERADMIN_EMAIL:}
superadmin.password=${SUPERADMIN_PASSWORD:}

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}