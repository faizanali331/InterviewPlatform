spring.application.name=mock-interview-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mock_interview?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=your-very-long-secret-key-at-least-32-characters-long
jwt.expiration=86400000
